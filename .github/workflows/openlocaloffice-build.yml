name: Build File Gestioner APK

on:
  push:
    branches:
      - main
    paths:
      - 'openlocaloffice-build/**'
      - '.github/workflows/openlocaloffice-build.yml'
  workflow_dispatch:
  pull_request:

# Only the newest commit on a PR consumes the Android emulator.
concurrency:
  group: file-gestioner-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          cat openlocaloffice-build/source.part* | base64 --decode > openlocaloffice-build/source.zip
          echo "076734f7351bad1f80c1aed261ff20074f689f9cd37fa7282dcf432ccecd9f82  openlocaloffice-build/source.zip" | sha256sum -c -
          rm -rf openlocaloffice-build/project
          mkdir -p openlocaloffice-build/project
          unzip -q openlocaloffice-build/source.zip -d openlocaloffice-build/project
          cp openlocaloffice-build/overrides/XmlUtil.java openlocaloffice-build/project/app/src/main/java/com/openlocal/office/core/XmlUtil.java
          cp openlocaloffice-build/overrides/SdocxSession.java openlocaloffice-build/project/app/src/main/java/com/openlocal/office/core/SdocxSession.java
          cd openlocaloffice-build/project
          for p in ../patches/*.patch; do patch -p1 < "$p"; done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify patched base source
        working-directory: openlocaloffice-build/project
        run: ./scripts/verify-source.sh

      - name: Apply full-content viewer features
        shell: bash
        working-directory: openlocaloffice-build/project
        run: |
          set -euo pipefail
          cat ../feature-patch/feature.patch.gz.b64.* | base64 --decode | gzip -dc > /tmp/openlocaloffice-feature.patch
          patch -p1 < /tmp/openlocaloffice-feature.patch
          for p in ../hotfixes/*.patch; do patch -p1 < "$p"; done
          python3 ../hotfixes/apply-picker-fallback.py
          python3 ../hotfixes/apply-webview-sdocx-runtime.py
          python3 ../hotfixes/apply-sdocx-continuous-editor.py
          python3 ../hotfixes/apply-mobile-spreadsheet-ui.py
          python3 ../hotfixes/apply-pro-app-branding.py
          python3 ../hotfixes/apply-spreadsheet-interactions.py
          python3 ../hotfixes/apply-landscape-real-icon.py
          ./scripts/check-android-java.sh
          ./scripts/test-core.sh
          cp ../additions/UniversalReader.java app/src/main/java/com/openlocal/office/core/UniversalReader.java
          cp ../additions/RichDocxPreview.java app/src/main/java/com/openlocal/office/core/RichDocxPreview.java
          cp ../additions/LegacyOfficeReader.java app/src/main/java/com/openlocal/office/core/LegacyOfficeReader.java
          cp ../additions/universal-reader.js app/src/main/assets/universal-reader.js
          python3 ../hotfixes/apply-universal-reader-backend.py
          python3 ../hotfixes/apply-universal-reader-ui.py
          python3 ../hotfixes/apply-docx-flow-editor.py
          python3 ../hotfixes/apply-3d-asset-viewer.py
          python3 ../hotfixes/apply-continuous-reader-css.py
          python3 ../hotfixes/apply-professional-pdf-ui.py
          cp ../additions/unified-viewer-controls.js app/src/main/assets/unified-viewer-controls.js
          python3 ../hotfixes/apply-unified-reader-experience.py
          cp ../additions/RemoteBookSpool.java app/src/main/java/com/openlocal/office/core/RemoteBookSpool.java
          cp ../additions/BookArchive.java app/src/main/java/com/openlocal/office/core/BookArchive.java
          cp ../additions/SeekableZip.java app/src/main/java/com/openlocal/office/core/SeekableZip.java
          cp ../additions/StreamedText.java app/src/main/java/com/openlocal/office/core/StreamedText.java
          python3 ../hotfixes/apply-epub-native-reader.py
          python3 ../hotfixes/apply-streamed-large-readers.py
          cp ../additions/epub-reader.js app/src/main/assets/epub-reader.js
          python3 ../hotfixes/apply-premium-book-ui.py
          python3 ../hotfixes/apply-saf-recent-permissions.py
          python3 ../hotfixes/apply-image-zip-reader-polish.py
          python3 ../hotfixes/apply-premium-library-native.py
          python3 ../hotfixes/apply-premium-v13-reader.py
          python3 ../hotfixes/apply-navigation-back.py
          python3 ../hotfixes/apply-seamless-webtoon.py
          python3 ../hotfixes/apply-gesture-first-reader.py
          python3 ../hotfixes/apply-device-ux-20261027.py
          cp ../pc-remote/fg-remote-ui.js app/src/main/assets/fg-remote-ui.js
          python3 ../hotfixes/apply-native-pc-remote.py
          cp ../hotfixes/fg-early-page.js app/src/main/assets/fg-early-page.js
          python3 ../hotfixes/apply-early-reader-preview.py
          python3 ../hotfixes/apply-library-layout-final.py
          cp ../additions/reader-controls.js app/src/main/assets/reader-controls.js
          python3 ../hotfixes/apply-reading-platform-20261030.py
          python3 ../hotfixes/apply-reader-controls-20261030.py
          python3 ../hotfixes/apply-scale-library-20261031.py
          python3 ../hotfixes/apply-scale-media-20261031.py
          python3 ../hotfixes/apply-streamed-image-folders-20261031.py
          python3 ../hotfixes/apply-image-fallback-20261031.py
          python3 ../hotfixes/apply-image-immersive-20261031.py
          python3 ../hotfixes/apply-native-file-actions-20261031.py
          python3 ../hotfixes/apply-library-transfer-20261031.py
          python3 ../hotfixes/apply-spreadsheet-mobile-20261031.py
          python3 ../hotfixes/apply-file-conversion-20261031.py
          python3 ../hotfixes/apply-release-version-20261031.py
          cp ../additions/FgTeraboxClient.java app/src/main/java/com/openlocal/office/core/FgTeraboxClient.java
          python3 ../hotfixes/apply-direct-terabox-20261031.py
          cp ../additions/FgMediaPlayer.java app/src/main/java/com/openlocal/office/core/FgMediaPlayer.java
          cp ../additions/FgGrowingMediaDataSource.java app/src/main/java/com/openlocal/office/core/FgGrowingMediaDataSource.java
          python3 -m py_compile ../hotfixes/apply-scale-library-20261031.py ../hotfixes/apply-scale-media-20261031.py ../hotfixes/apply-streamed-image-folders-20261031.py ../hotfixes/apply-file-conversion-20261031.py
          grep -Fq 'ReaderLibrary.stream(' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'listTeraboxNative(' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'getTeraboxConfigured()' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'AES/GCM/NoPadding' app/src/main/java/com/openlocal/office/core/FgTeraboxClient.java
          grep -Fq 'androidx.media3:media3-exoplayer:1.11.1' app/build.gradle.kts
          grep -Fq 'FgMediaPlayer' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'fgFolderPageMap' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'fgFallbackBitmap' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'setImageImmersiveInternal' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'getRemoteEndpoint' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'canManageLibraryFiles' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'copyLibraryFile' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'moveLibraryFile' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'convertLibraryFile' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'checkCollectionKoikatsu' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'fg-spreadsheet-reading' app/src/main/assets/style.css
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/premium-library.js
          node ../hotfixes/test-media-image-regressions.cjs
          python3 -m py_compile ../hotfixes/apply-reading-platform-20261030.py ../hotfixes/apply-reader-controls-20261030.py
          node --check app/src/main/assets/reader-controls.js
          grep -Fq 'openFolderImages' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'showFgMedia' app/src/main/java/com/openlocal/office/MainActivity.java
          python3 -m py_compile ../noworld-bridge/blender_preview_export.py ../noworld-bridge/noworld_asset_bridge.py
          python3 -m unittest discover -s ../noworld-bridge -p 'test_*.py' -v
          python3 -m py_compile ../noworld-bridge/inspect_noworld_glb.py
          grep -Fq 'source_anchor' ../hotfixes/apply-3d-asset-viewer.py

          # Bundle source-pinned, vendored Three.js; NO runtime CDN or model upload.
          mkdir -p app/src/main/assets/three-vendor
          cp -R ../three-vendor/. app/src/main/assets/three-vendor/
          cp ../additions/model-viewer.entry.js app/src/main/assets/model-viewer.entry.js
          npx --yes esbuild@0.25.12 app/src/main/assets/model-viewer.entry.js \
            --bundle --minify --format=iife --target=chrome110 --legal-comments=eof \
            --outfile=app/src/main/assets/model-viewer.bundle.js
          test -s app/src/main/assets/model-viewer.bundle.js
          node --check app/src/main/assets/model-viewer.bundle.js
          grep -Fq 'window.FileGestionerModelViewer=' app/src/main/assets/model-viewer.entry.js
          grep -Fq 'NoWorld · Source-linked asset preview' app/src/main/assets/model-viewer.entry.js
          grep -Fq 'requiresConversion' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'noworld_asset' app/src/main/assets/model-viewer.bundle.js

          grep -Fq 'model3d' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'model/*' app/src/main/AndroidManifest.xml
          bash ../hotfixes/test-rich-docx-reader.sh
          node --check app/src/main/assets/universal-reader.js
          node --check app/src/main/assets/unified-viewer-controls.js
          node ../hotfixes/test-continuous-reader.cjs
          node ../hotfixes/test-seamless-webtoon.cjs
          node --check app/src/main/assets/unified-viewer-controls.js
          node ../hotfixes/test-unified-reader.cjs
          node ../hotfixes/test-native-scroll.cjs
          node --check app/src/main/assets/epub-reader.js
          node ../hotfixes/test-premium-book-reader.cjs
          grep -Fq 'candidate.comicLike()' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'getPersistedUriPermissions()' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'OS' app/src/main/java/com/openlocal/office/core/BookArchive.java || true
          grep -Fq 'Comic ZIP' ../hotfixes/test-archive-saf-regression.cjs
          node ../hotfixes/test-archive-saf-regression.cjs
          node --check app/src/main/assets/premium-library.js
          node ../hotfixes/test-premium-v13.cjs
          node ../hotfixes/test-final-reader.cjs
          grep -Fq 'FG_BOOK' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'new SeekableZip(handle)' app/src/main/java/com/openlocal/office/core/BookArchive.java
          grep -Fq 'premium-library.js' app/src/main/assets/index.html
          grep -Fq 'ReaderLibrary.Listing' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'KoikatsuCards.isCharacterCard' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq '0.12.1' app/src/main/assets/style.css
          grep -Fq 'fg-book-mode' app/src/main/assets/style.css
          grep -Fq 'epub-reader.js' app/src/main/assets/index.html
          grep -Fq 'BookArchive candidate' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'new StreamedText' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'shouldInterceptRequest' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'unified-viewer-controls.js' app/src/main/assets/index.html
          grep -Fq 'File Gestioner 0.11' app/src/main/assets/style.css
          grep -Fq "actions.append(q('−'" app/src/main/assets/model-viewer.entry.js
          grep -Fq 'fg-pdf-reading' app/src/main/assets/universal-reader.js
          grep -Fq 'File Gestioner 0.10.3' app/src/main/assets/style.css
          grep -Fq 'Math.min(2400,targetWidth)' app/src/main/java/com/openlocal/office/core/UniversalReader.java
          grep -Fq 'getPdfPageMetrics' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'File Gestioner 0.10.2' app/src/main/assets/style.css
          grep -Fq 'getPdfPage' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'UniversalReader.extractDocument' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'LegacyOfficeReader.read' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'getDocxRichBlockCount' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'findDocxBlock' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq 'fg-docx-edit-paragraph' app/src/main/assets/app.js
          grep -Fq 'fg-docx-edit-sheet' app/src/main/assets/style.css
          grep -Fq 'poi-scratchpad' app/build.gradle.kts
          grep -Fq 'universal-reader.js' app/src/main/assets/index.html
          grep -Fq 'File Gestioner immersive reader + unified document UI' app/src/main/assets/style.css
          node --check app/src/main/assets/app.js
          grep -q 'getSheetWindow' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -q 'search(String needle' app/src/main/java/com/openlocal/office/core/XlsxSession.java
          grep -q 'text/markdown' app/src/main/AndroidManifest.xml
          grep -q 'application/zip' app/src/main/AndroidManifest.xml
          grep -q 'application/octet-stream' app/src/main/AndroidManifest.xml
          grep -q 'looksLikeSdocx' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq '<data android:mimeType="application/*" />' app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          s = Path("app/src/main/java/com/openlocal/office/MainActivity.java").read_text()
          start = s.index("private void openPicker(")
          brace = s.index("{", start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == "{": depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          body = s[start:end]
          assert '"*/*"' in body
          assert 'EXTRA_MIME_TYPES' not in body
          PY
          grep -q 'Search the whole document' app/src/main/assets/index.html
          grep -Fq 'File Gestioner' app/src/main/assets/index.html
          grep -Fq 'File Gestioner pro UI polish' app/src/main/assets/style.css
          grep -Fq 'OpenLocalOffice mobile spreadsheet UI hotfix' app/src/main/assets/style.css
          grep -Fq 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -Fq 'id="spreadsheetTools"' app/src/main/assets/index.html
          grep -Fq 'File Gestioner spreadsheet interaction layer' app/src/main/assets/style.css
          grep -Fq 'File Gestioner landscape + real icon' app/src/main/assets/style.css
          grep -Fq 'android:configChanges="orientation|screenSize|keyboardHidden"' app/src/main/AndroidManifest.xml
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png


      - name: Verify expanded viewer
        working-directory: openlocaloffice-build/project
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/universal-reader.js
          # Android-only renderer sources compile with Android SDK during assembleRelease.
          # Existing JVM-only source harness remains executed before installation.
          grep -q 'android.intent.action.VIEW' app/src/main/AndroidManifest.xml
          grep -q 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' app/src/main/AndroidManifest.xml
          grep -q 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' app/src/main/AndroidManifest.xml
          grep -q 'text/csv' app/src/main/AndroidManifest.xml
          grep -q 'text/plain' app/src/main/AndroidManifest.xml
          grep -q 'text/markdown' app/src/main/AndroidManifest.xml
          grep -q 'application/zip' app/src/main/AndroidManifest.xml
          grep -q 'application/octet-stream' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.BROWSABLE' app/src/main/AndroidManifest.xml
          grep -Fq '<data android:mimeType="application/*" />' app/src/main/AndroidManifest.xml
          grep -q 'looksLikeSdocx' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -Fq '.notice{display:none!important}' app/src/main/assets/style.css
          grep -q 'SdocxSession.open(bytes)' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -q 'SdocxSession.validate(bytes)' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -q 'getSdocxText' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -q 'setSdocxText' app/src/main/java/com/openlocal/office/MainActivity.java
          grep -q "ed.id='sdocxEditor'" app/src/main/assets/app.js
          grep -q "className='sdocxEditorWrap'" app/src/main/assets/app.js
          grep -Fq "document.querySelector('.searchbar')?.classList.add('hidden')" app/src/main/assets/app.js
          grep -Fq "$('textFormat').classList.add('hidden')" app/src/main/assets/app.js
          grep -Fq '.sdocxEditor{' app/src/main/assets/style.css
          ! grep -q 'SDOCX preview is read-only' app/src/main/java/com/openlocal/office/MainActivity.java
          ! grep -q 'Page →' app/src/main/assets/app.js

      - name: Export assembled source for implementation audit
        uses: actions/upload-artifact@v4
        with:
          name: file-gestioner-expanded-source
          path: |
            openlocaloffice-build/project/app/src/main/java/
            openlocaloffice-build/project/app/src/main/assets/
            openlocaloffice-build/project/app/src/main/AndroidManifest.xml
          retention-days: 1

      # Release artifacts are signed with the existing identity only.
      # Do not generate debug keys or an unsigned APK and call it a release.
      - name: Normalize approved launcher assets for release
        working-directory: openlocaloffice-build/project
        shell: bash
        run: |
          set -euo pipefail
          python3 ../hotfixes/normalize-release-icons.py

      - name: Build release APK
        working-directory: openlocaloffice-build/project
        run: gradle --no-daemon --max-workers=2 assembleRelease --stacktrace

      - name: Stage unsigned release for signing on authorized PC
        uses: actions/upload-artifact@v4
        with:
          name: File-Gestioner-unsigned-release-apk
          path: openlocaloffice-build/project/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

      - name: Validate existing release signing credentials
        shell: bash
        env:
          FG_RELEASE_KEYSTORE_BASE64: ${{ secrets.FG_RELEASE_KEYSTORE_BASE64 }}
          FG_RELEASE_STORE_PASSWORD: ${{ secrets.FG_RELEASE_STORE_PASSWORD }}
          FG_RELEASE_KEY_ALIAS: ${{ secrets.FG_RELEASE_KEY_ALIAS }}
          FG_RELEASE_KEY_PASSWORD: ${{ secrets.FG_RELEASE_KEY_PASSWORD }}
          FG_RELEASE_CERT_SHA256: ${{ secrets.FG_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in FG_RELEASE_KEYSTORE_BASE64 FG_RELEASE_STORE_PASSWORD FG_RELEASE_KEY_ALIAS FG_RELEASE_KEY_PASSWORD FG_RELEASE_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Existing release signing configuration is missing: $name. No debug or substitute signing identity will be used."
              exit 1
            fi
          done

      - name: Sign and verify release with preserved signing identity
        shell: bash
        env:
          FG_RELEASE_KEYSTORE_BASE64: ${{ secrets.FG_RELEASE_KEYSTORE_BASE64 }}
          FG_RELEASE_STORE_PASSWORD: ${{ secrets.FG_RELEASE_STORE_PASSWORD }}
          FG_RELEASE_KEY_ALIAS: ${{ secrets.FG_RELEASE_KEY_ALIAS }}
          FG_RELEASE_KEY_PASSWORD: ${{ secrets.FG_RELEASE_KEY_PASSWORD }}
          FG_RELEASE_CERT_SHA256: ${{ secrets.FG_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          temp_key="$(mktemp)"
          trap 'rm -f "$temp_key"' EXIT
          printf '%s' "$FG_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$temp_key"
          unsigned="openlocaloffice-build/project/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned" || { echo "::error::Unsigned release artifact is missing; refusing to re-sign any debug artifact."; exit 1; }
          destination="openlocaloffice-build/project/app/build/outputs/apk/release/app-release-signed.apk"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign --ks "$temp_key" --ks-type PKCS12 \
            --ks-key-alias "$FG_RELEASE_KEY_ALIAS" \
            --ks-pass env:FG_RELEASE_STORE_PASSWORD \
            --key-pass env:FG_RELEASE_KEY_PASSWORD \
            --out "$destination" "$unsigned"
          "$signer" verify --verbose --print-certs "$destination"
          actual="$("$signer" verify --print-certs "$destination" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$FG_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            rm -f "$destination"
            echo "::error::Release signing certificate differs from the approved installed identity."
            exit 1
          fi
          echo "Signed release certificate verified against approved fingerprint."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: File-Gestioner-signed-release-apk
          path: openlocaloffice-build/project/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="file-gestioner-release-${{ github.run_number }}"
          gh release create "$tag" openlocaloffice-build/project/app/build/outputs/apk/release/app-release-signed.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "File Gestioner signed release candidate ${{ github.run_number }}" \
            --notes "Signed release candidate using the preserved File Gestioner signing certificate. Device regression testing required before production rollout." \
            --prerelease

      - name: Enable emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 runtime validation — EPUB, archive, navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          disable-animations: true
          script: bash openlocaloffice-build/hotfixes/android-runtime-smoke.sh

      - name: Upload runtime evidence even after a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: File-Gestioner-android-runtime-evidence
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7
